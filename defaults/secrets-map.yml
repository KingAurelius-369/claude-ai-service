GITHUB_TOKEN: required
SEMGREP_APP_TOKEN: optional
AWS_ACCESS_KEY_ID: required if SECRET_BACKEND=aws
AWS_SECRET_ACCESS_KEY: required if SECRET_BACKEND=aws
AZURE_CREDENTIALS: required if SECRET_BACKEND=azure
VAULT_TOKEN: required if SECRET_BACKEND=vault
SECRET_BACKEND: optional (env|conjur|aws|azure|vault, defaults to env)
CONJUR_URL: required if SECRET_BACKEND=conjur
CONJUR_ACCOUNT: required if SECRET_BACKEND=conjur
CONJUR_USERNAME: required if SECRET_BACKEND=conjur
CONJUR_PASSWORD: required if SECRET_BACKEND=conjur
